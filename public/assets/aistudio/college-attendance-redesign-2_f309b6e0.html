/* ===================== BASE ===================== */

.strip::after { content: ""; position: absolute; top: 0; bottom: 0; left: -50%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-18deg); opacity: 0; } .sc.flash .strip::after { animation: sheen .9s .15s ease-out; } @keyframes sheen { 0% { left: -50%; opacity: 1; } 100% { left: 130%; opacity: 1; } }

/* other pages */

/* ===================== LIQUID-GLASS DOCK ===================== */

.dlens::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0) 48%); }
.dlens::after { content: ""; position: absolute; z-index: 2; top: 0; bottom: 0; width: 45%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-18deg); }
.cap.go .dlens::after { animation: shine .6s ease-out; } .cap.press .dlens { scale: 1.1; } .cap.press .dtint { opacity: .5; }

.pop[data-k=home] svg { animation: hop .5s cubic-bezier(.3,1.4,.5,1); } .pop[data-k=att] .tick { animation: dtick .5s .1s ease both; } .pop[data-k=time] .hand { animation: spin .7s cubic-bezier(.3,.9,.3,1); }

/* HOME */

/* ===================== PERFORMANCE ===================== */

html.moving .surf, html.moving .btn, html.moving .pill, html.moving .chip, html.moving .ico, html.moving .strip, html.moving .hbtn, html.moving .sc, html.moving .trw, html.moving .tt, html.moving .rs, html.moving .item, html.moving .tag, html.moving .stat, html.moving .fchip, html.moving .seg button, html.moving .sw, html.moving .sw::after, html.moving .msg { transition: none !important; }
html.moving .dock, html.moving .tg { -webkit-backdrop-filter: none; backdrop-filter: none; }
html.moving .cl, html.moving .au, html.moving .stars, html.moving .shoot { animation-play-state: paused; }
.page { contain: layout style; }
.sc, .tt, .rs, .nc, .trw { contain: layout style paint; }

.pe-bar { position: sticky; bottom: -20px; z-index: 2; display: flex; gap: 10px; margin: 14px -18px -20px; padding: 14px 18px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--chip-b); } .pe-bar .btn { flex: 1; }

/* ===================== DEVELOPER CARD ===================== */
.sg.dv2 { position: relative; overflow: hidden; padding: 24px 20px 26px; text-align: center; background: linear-gradient(165deg, color-mix(in srgb, #1e40af 26%, transparent), transparent 55%), var(--surface); }
.dv2 .halo { position: absolute; left: 50%; top: 56px; width: 280px; height: 280px; margin-left: -140px; border-radius: 50%; background: radial-gradient(closest-side, rgba(70,150,255,.34), rgba(139,92,246,.18) 60%, transparent); pointer-events: none; }
.dv2 > *:not(.halo) { position: relative; }
.dv2 .dtop { display: flex; align-items: center; justify-content: center; gap: 12px; } .dv2 .dline { height: 1px; width: 44px; background: linear-gradient(90deg, transparent, #38bdf8); } .dv2 .dline:last-child { background: linear-gradient(90deg, #38bdf8, transparent); } .dv2 .dl { font: 700 11px var(--f-num); letter-spacing: .36em; color: #38bdf8; }
.dv2 .dlogo { position: relative; display: block; width: 120px; height: 120px; margin: 20px auto 16px; padding: 7px; border-radius: 50%; transform: perspective(500px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .35s cubic-bezier(.2,.9,.3,1); } .dv2 .dlogo:active { scale: .94; }
.dv2 .ringc { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, #22d3ee, #3b82f6, #8b5cf6, #22d3ee); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); will-change: transform; box-shadow: 0 0 30px rgba(60,140,255,.45); }
.dv2 .dlogo.spin .ringc { animation: spinr 1.1s cubic-bezier(.3,.9,.3,1); } @keyframes spinr { to { transform: rotate(360deg); } }
.dv2 .dlogo img { position: relative; width: 100%; height: 100%; border-radius: 50%; display: block; background: #fff; box-shadow: 0 14px 28px -10px rgba(40,100,255,.75); }
.dv2 .dname { font-family: var(--f-serif); font-style: italic; font-weight: 700; font-size: 29px; letter-spacing: -.01em; line-height: 1.15; display: block; margin: 0; }
.dv2 .drole { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 15px; margin-top: 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: #38bdf8; background: color-mix(in srgb, #38bdf8 14%, transparent); border: 1.5px solid color-mix(in srgb, #38bdf8 40%, transparent); } .dv2 .drole .i { font-size: 16px; }
