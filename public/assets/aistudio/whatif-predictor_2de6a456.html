.cls:active{transform:scale(.985)}.cls::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--ac)}
.cls b{display:block;font-size:14px;line-height:1.3}.cls span{font-size:12px;color:var(--mu);font-weight:600;display:block;margin-top:2px}

.cls.on{border-color:rgba(46,230,176,.7)}.cls.on .cb{background:linear-gradient(135deg,#17d6a4,#0a9f8d);border-color:transparent;color:#fff;transform:scale(1.08)}
.cls.lock{opacity:.62}.cls.lock .cb{border-style:dashed;color:var(--mu);order:3;margin-left:auto}.cls.lock::before{opacity:.4}
.sum{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--mu);margin:2px 2px 0}.sum b{color:var(--tx)}

.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:21px;font-weight:800}.ring.s{width:100px;height:100px}.ring.s b{font-size:17px}.ring .ic{font-size:34px;color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--cb);font-size:13.5px;font-weight:700}.row.f{border-top:0}.row small{display:block;color:var(--mu);font-size:11.5px;font-weight:600;margin-top:2px}
.dl{font-weight:800}.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}

table{width:100%;border-collapse:collapse;font-size:13px;font-weight:700}th{font-size:11.5px;color:var(--mu);text-align:right;padding:0 0 8px}th:first-child,td:first-child{text-align:left}td{padding:10px 0;border-top:1px solid var(--cb);text-align:right}td small{display:block;font-size:11px;color:var(--mu);font-weight:600}

@keyframes outL{to{opacity:0;transform:translateX(-24px)}}@keyframes outR{to{opacity:0;transform:translateX(24px)}}

const fmt = (s) => { const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()].slice(0, 3)}`; }, fmtY = (s) => fmt(s) + ' ' + parse(s).getFullYear();

/* ======================= WIF-CALC: pure, no DOM ======================= */
const Calc = {
  eligible: (ds) => (HOST.holiday(ds) ? [] : HOST.classesOn(ds).filter((c) => !c.always && !HOST.cancelled(ds, c))),
  selectable(ds) { const w = parse(ds).getDay(); return ds > HOST.today() && w >= 1 && w <= 5 && !HOST.holiday(ds) && this.eligible(ds).length > 0; },
  status(p) { const t = HOST.target(); return p < t ? 'bad' : p < t + 3 ? 'warn' : 'ok'; },
  simulate(plan) {   // plan = [{ds, missed:[classId]}] → hypothetical totals; real records untouched
    const M = {}; HOST.subjects().forEach((s) => (M[s.code] = { ...s, p2: s.p, n2: s.n, add: 0, miss: 0 }));
    const days = plan.map((d) => {
      const ms = new Set(d.missed), seen = new Set(), rows = [];
      this.eligible(d.ds).forEach((c) => {
        if (seen.has(c.id)) return; seen.add(c.id);
        const s = (M[c.code] = M[c.code] || { code: c.code, name: c.name, p: 0, n: 0, p2: 0, n2: 0, add: 0, miss: 0 });
        const miss = ms.has(c.id); s.n2++; s.add++; miss ? s.miss++ : s.p2++; rows.push({ ...c, miss });
      });
      return { ds: d.ds, rows, missed: rows.filter((x) => x.miss).length, kept: rows.filter((x) => !x.miss).length };
    });
    const subs = Object.values(M).map((s) => ({ ...s, cur: pc(s.p, s.n), pred: pc(s.p2, s.n2), hasPlan: s.add > 0 }));
    const sum = (k) => subs.reduce((a, s) => a + s[k], 0), cur = pc(sum('p'), sum('n')), pred = pc(sum('p2'), sum('n2'));
    return { days, subs, cur, pred, diff: pred - cur, missed: days.reduce((a, d) => a + d.missed, 0), status: this.status(pred) };
  },
  message(r) {
    const t = HOST.target(), p = r1(r.pred);
    if (r.cur < t) return ['bad', `Your attendance is already below your ${t}% target. This plan takes it to ${p}%.`];
    if (!r.missed) return ['ok', 'No classes are missed in this plan, so your attendance stays the same.'];
    if (r.pred < t) return ['bad', `This plan may bring your attendance below your ${t}% target (${p}%).`];
    if (r.pred < t + 3) return ['warn', `You have limited room for more absences. You would stay just above ${t}% (${p}%).`];
    return ['ok', `Your predicted attendance of ${p}% stays above your ${t}% target.`];
  }
};

  for (let d = 1; d <= dim; d++) {
    const ds = `${ST.month}-${String(d).padStart(2, '0')}`, sel = ST.dates.includes(ds), ok = Calc.selectable(ds), h = HOST.holiday(ds);
    c += `<button class="d ${sel ? 's' : h ? 'h' : ok ? 'ok' : 'no'} ${ds === HOST.today() ? 't' : ''}" ${ok ? `data-a="pick" data-v="${ds}" aria-pressed="${sel}"` : 'disabled'} aria-label="${fmtL(ds)}${h ? ', holiday ' + esc(h) : ''}${sel ? ', selected' : ''}">${d}</button>`;
  }
  return c;
};
const calTitle = () => { const [y, m] = ST.month.split('-').map(Number); return `${MON[m - 1]} ${y}`; };
function vPlan() {
  return `${bar('What-If Predictor', 'intro')}${tabs('plan')}
  <div><h2 style="font-size:20px">Select Dates</h2><p class="mu" style="margin:3px 0 12px">Choose the days you want to plan for</p><div class="card"><div class="cal-h"><button class="ib" data-a="mo" data-v="-1" aria-label="Previous month">${I('back')}</button><b id="mt">${calTitle()}</b><button class="ib" data-a="mo" data-v="1" aria-label="Next month">${I('nx')}</button></div><div class="cg" id="cgrid">${calCells()}</div>
  <div class="leg"><span><i style="background:#17d6a4"></i>Selected</span><span><i style="background:#ff6b95"></i>Holiday</span><span><i style="background:#6a7fb8"></i>Not Selectable</span></div></div></div>
  <div><h3>Plan Type</h3><div class="two"><button class="pt ${ST.mode === 'whole' ? 'on' : ''}" data-a="mode" data-v="whole" aria-pressed="${ST.mode === 'whole'}">${I('sun')}<b>Whole Day</b><span>Mark all classes as leave/bunk</span></button><button class="pt ${ST.mode === 'sel' ? 'on' : ''}" data-a="mode" data-v="sel" aria-pressed="${ST.mode === 'sel'}">${I('list')}<b>Selected Classes</b><span>Choose specific classes only</span></button></div></div>`;
}
const planDock = () => dockOf(`<p class="mu sm" id="pc" style="text-align:center">${ST.dates.length ? `${ST.dates.length} date${ST.dates.length > 1 ? 's' : ''} selected` : 'Pick at least one date'}</p><button class="btn" id="pn" data-a="toClasses" ${ST.dates.length ? '' : 'disabled'}>Next ${I('ar')}</button>`);

const curDate = () => (ST.dates.includes(ST.active) ? ST.active : sorted()[0]);
const rowSt = (ds, c) => { const lock = c.always, canc = HOST.cancelled(ds, c), P = planOf().find((p) => p.ds === ds); return { lock, canc, on: !lock && !canc && !!P && P.missed.includes(c.id), dis: lock || canc }; };
const rowHtml = (ds, c) => { const s = rowSt(ds, c); return `<button class="cls ${s.on ? 'on' : ''} ${s.dis ? 'lock' : ''}" style="--ac:${c.ac}" data-id="${c.id}" ${s.dis ? 'tabindex="-1"' : `data-a="cls" data-v="${c.id}"`} role="checkbox" aria-checked="${s.on}" aria-disabled="${s.dis}"><div class="cb">${I(s.dis ? 'lock' : 'chk')}</div><div style="flex:1;min-width:0"><b>${esc(c.always ? c.name + ' (Always Present)' : c.code + ' – ' + c.name)}</b><span>${esc(c.time)}</span>${s.lock ? '<span>Not available for selection</span>' : s.canc ? '<span>Cancelled · excluded</span>' : ''}</div></button>`; };
const listHtml = () => { const ds = curDate(); return HOST.classesOn(ds).map((c) => rowHtml(ds, c)).join('') || '<div class="card mu">No scheduled classes on this date.</div>'; };
const sumHtml = () => { const tot = planOf().reduce((a, p) => a + p.missed.length, 0); return `<span><b>${ST.dates.length}</b> dates</span><span><b>${tot}</b> classes included</span><span>${ST.mode === 'whole' ? 'Whole day' : 'Selected classes'}</span>`; };
const chipsHtml = () => sorted().map((d) => `<button class="dc ${d === curDate() ? 'on' : ''}" data-a="active" data-v="${d}">${fmt(d)}<small>${WD[parse(d).getDay()]}</small></button>`).join('');
function vClasses() {
  return `${bar('What-If Predictor', 'plan')}
  <div><h2 style="font-size:20px">Select Classes</h2><p class="mu" style="margin:3px 0 12px">Choose the classes you want to plan for the selected days.</p></div>
  <div class="chips" id="chips">${chipsHtml()}</div>
  <div class="seg ${ST.mode === 'sel' ? 'r' : ''}" id="seg2"><i></i><button class="${ST.mode === 'whole' ? 'on' : ''}" data-a="mode2" data-v="whole">All Classes</button><button class="${ST.mode === 'sel' ? 'on' : ''}" data-a="mode2" data-v="sel">Selected Classes</button></div>
  <div id="clist">${listHtml()}</div><div class="sum" id="sum">${sumHtml()}</div>`;
}
const classDock = () => dockOf(`<button class="btn" id="cb" data-a="calc" ${planOf().some((p) => p.missed.length) ? '' : 'disabled'}>Calculate Prediction ${I('ar')}</button>`);

function vResult() {
  const r = ST.res, [k, text] = Calc.message(r), ds = r.days.map((x) => x.ds).sort(), per = r.days.map((x) => x.missed), same = per.every((x) => x === per[0]);
  const days = ds.map((d) => WD[parse(d).getDay()]).join(', ');
  return `${bar('What-If Predictor', 'classes')}
  <div class="card hl"><div class="ringw">${ring(r.pred, '', `<span style="position:absolute;inset:0;display:grid;place-items:center" class="${k}">${I(k === 'bad' ? 'wr' : 'ok')}</span>`)}<div style="min-width:0"><p class="mu" style="font-weight:700">Predicted Overall Attendance</p><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 4px"><span class="big cnt" data-v="${r1(r.pred)}" style="font-size:36px">${r1(r.pred)}%</span>${dlt(r.diff)}</div><p class="mu sm">(from ${r1(r.cur)}%) · target ${HOST.target()}%</p></div></div><div style="margin-top:12px">${tagFor(r.status)}</div></div>
  <div class="msg ${k}">${I(k === 'ok' ? 'ok' : 'wr')}<span>${esc(text)}</span></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Plan Summary</h3><button class="tag edit" data-a="plan">Edit</button></div>
    <div class="dr" style="margin-top:12px">${I('cal')}<span>${fmtY(ds[0])}${ds.length > 1 ? ' - ' + fmtY(ds[ds.length - 1]) : ''} (${ds.length} Day${ds.length > 1 ? 's' : ''})</span></div>
    <div class="k2"><div><small>Leave / Bunk Days</small><b>${ds.length} day${ds.length > 1 ? 's' : ''}</b><small>(${days})</small></div><div><small>Classes Affected</small><b>${r.missed} class${r.missed === 1 ? '' : 'es'}</b><small>(${same ? per[0] + ' per day' : 'varies by day'})</small></div></div></div>
  <div class="card"><h3>Day Wise Details</h3>${r.days.map((x, i) => { const dd = Calc.simulate(planOf().filter((p) => p.ds === x.ds)).diff, kd = kindOf(x.ds); return `<div class="row ${i ? '' : 'f'}"><div>${fmt(x.ds)} (${WD[parse(x.ds).getDay()]})<small>${x.missed} missed · ${x.kept} attended</small></div><button class="tag ${kd === 'Leave' ? 'lv' : 'bk'}" data-a="kind" data-v="${x.ds}" aria-label="Tap to switch ${kd} / ${kd === 'Leave' ? 'Bunk' : 'Leave'}">${kd}</button>${dlt(dd)}</div>`; }).join('')}<p class="mu sm" style="margin-top:6px">Tap Leave / Bunk to relabel a day. It does not change the calculation.</p></div>`;
}
const resDock = () => dockOf(`<button class="btn" data-a="saveSheet">${I('bm')}Save Scenario</button><button class="btn ghost" data-a="detail">View Details</button>`);

function vDetail() {
  const r = ST.res, [k, text] = Calc.message(r), t = HOST.target();
  const rows = r.subs.filter((s) => s.hasPlan).map((s) => `<tr><td>${esc(s.code)}<small>${s.miss} of ${s.add} missed</small></td><td>${r1(s.cur)}%</td><td style="color:var(--${Calc.status(s.pred) === 'bad' ? 'bad' : Calc.status(s.pred) === 'warn' ? 'warn' : 'ok'})">${r1(s.pred)}%<small>${dlt(s.pred - s.cur)}</small></td></tr>`).join('');
  const none = r.subs.filter((s) => !s.hasPlan).length;
  return `${bar('What-If Predictor', 'results')}
  <div><h2 style="font-size:20px">Detailed Breakdown</h2><p class="mu" style="margin:3px 0 12px">This shows how your attendance changes based on your planned days.</p></div>
  <div class="card hl"><h3>${I('chart')}Attendance Comparison</h3><div style="display:flex;align-items:center;justify-content:space-around">${ring(r.cur, 's')}${I('ar').replace('class="ic"', 'class="ic" style="font-size:26px;color:var(--mu)"')}${ring(r.pred, 's')}</div><div style="display:flex;justify-content:space-around;margin-top:6px" class="mu sm"><span>Current</span><span>After Plan</span></div></div>
  <div class="card"><h3>Subject-wise Impact</h3><table><thead><tr><th>Subject</th><th>Current</th><th>After Plan</th></tr></thead><tbody>${rows}<tr><td><b>Overall</b></td><td>${r1(r.cur)}%</td><td style="color:var(--${r.status === 'bad' ? 'bad' : r.status === 'warn' ? 'warn' : 'ok'})">${r1(r.pred)}%<small>${dlt(r.diff)}</small></td></tr></tbody></table>${none ? `<p class="mu sm" style="margin-top:8px">${none} other subject${none > 1 ? 's have' : ' has'} no classes in this plan, so ${none > 1 ? 'they are' : 'it is'} unchanged. Target ${t}%.</p>` : ''}</div>
  <div class="card"><h3>${I('cal')}Day-by-Day Breakdown</h3>${r.days.map((x) => `<details><summary><span>${fmt(x.ds)} (${WD[parse(x.ds).getDay()]})</span><span class="mu sm" style="margin-left:auto">${x.missed} missed · ${x.kept} attended</span>${I('nx')}</summary>${x.rows.map((c) => `<div class="li ${c.miss ? 'm' : 'a'}"><span>${esc(c.code)} · ${esc(c.time)}</span><b>${c.miss ? 'Planned absence' : 'Will attend'}</b></div>`).join('')}${HOST.classesOn(x.ds).filter((c) => c.always).map((c) => `<div class="li"><span>${esc(c.name)}</span><span>Always present · excluded</span></div>`).join('')}${HOST.classesOn(x.ds).filter((c) => HOST.cancelled(x.ds, c)).map((c) => `<div class="li"><span>${esc(c.code)}</span><span>Cancelled · excluded</span></div>`).join('')}</details>`).join('')}</div>
  <div class="msg ${k}">${I(k === 'ok' ? 'ok' : 'wr')}<span>${esc(text)} Planned absences are a simulation. Your recorded attendance is unchanged.</span></div>`;
}
const detDock = () => dockOf(`<button class="btn" data-a="saveSheet">${I('bm')}Save Scenario</button><div class="two"><button class="btn ghost" data-a="plan">Edit Plan</button><button class="btn ghost" data-a="results">Back to Results</button></div>`);

function vSaved() {
  const t = HOST.target(), note = ST.note ? `<div class="msg warn">${I('wr')}<span>${esc(ST.note)}</span></div>` : '';
  if (!ST.saved.length) return `${bar('What-If Predictor', 'intro')}${tabs('saved')}${note}<div class="empty"><div class="art">${ART2}</div><h2>No Saved Scenarios Yet</h2><p class="mu">Start planning your leaves or bunk days to see your predicted attendance.</p><button class="btn" style="margin-top:20px" data-a="new">Create New Plan</button></div>`;
  return `${bar('What-If Predictor', 'intro')}${tabs('saved')}${note}<div><h2 style="font-size:20px">Saved Scenarios</h2><p class="mu" style="margin:3px 0 12px">View and manage your previous plans</p></div>` + ST.saved.map((s) => { const kd = kindTag(s.dates.map((d) => (s.kind || {})[d] || 'Leave')); return `<div class="card sc"><div class="top"><div class="ib">${I('cal')}</div><div style="flex:1;min-width:0"><b>${esc(s.name)}</b><p class="mu sm">${s.dates.length > 1 ? fmtY(s.dates[0]) + ' - ' + fmtY(s.dates[s.dates.length - 1]) : fmtY(s.dates[0])} · ${s.mode === 'whole' ? 'Whole day' : 'Selected classes'}, ${s.missed} classes</p></div><span class="tag ${kd === 'Leave' ? 'lv' : 'bk'}">${kd}</span></div>
  <div class="bt"><div style="flex:1"><p class="mu sm">Predicted</p><div style="display:flex;align-items:center;gap:8px;margin-top:3px"><b style="font-size:24px">${r1(s.pred)}%</b><span class="tag ${s.pred >= t ? 'ok' : 'bad'}" style="height:22px;font-size:11px">${s.pred >= t ? 'Meets target' : 'Below target'}</span></div></div><button class="ibs" data-a="dup" data-v="${s.id}" aria-label="Duplicate scenario">${I('cp')}</button><button class="ibs" data-a="del" data-v="${s.id}" aria-label="Delete scenario">${I('tr')}</button><button class="tag" data-a="open" data-v="${s.id}">View</button></div></div>`; }).join('');
}

/* ======================= WIF-RENDER + TRANSITIONS ======================= */
const VIEWS = { intro: [vIntro, introDock], plan: [vPlan, planDock], classes: [vClasses, classDock], results: [vResult, resDock], detail: [vDetail, detDock], saved: [vSaved, () => ''] };
function countUp(el) {
  const to = +el.dataset.v; if (reduce) return; const t0 = performance.now();
  const f = (n) => { const k = Math.min(1, (n - t0) / 1000), e = 1 - Math.pow(1 - k, 3); el.textContent = r1(to * e) + '%'; if (k < 1) requestAnimationFrame(f); }; f(t0);
}
function render(dir = '') {
  if (ST.screen === 'classes' && !ST.dates.length) ST.screen = 'plan';
  if ((ST.screen === 'results' || ST.screen === 'detail') && !ST.res) ST.screen = 'plan';
  const [v, d] = VIEWS[ST.screen], app = $('#app');
  app.dataset.t = dir ? 'in-' + dir : '';
  $('#view').innerHTML = v(); $('#dockh').innerHTML = d();
  document.documentElement.style.setProperty('--dh', ($('#dockh').offsetHeight || 20) + 'px');
  window.scrollTo(0, 0);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('.ring .fg').forEach((c) => (c.style.strokeDashoffset = 276.5 * (1 - Math.min(100, +c.dataset.p) / 100)));
    $$('.meter i').forEach((m) => (m.style.width = Math.min(100, +m.dataset.w) + '%'));
    if (dir) $$('.cnt').forEach(countUp);
  }));
}
let busy = false;
function go(s) {
  if (busy) return; HOST.haptic();
  const dir = ORDER[s] >= ORDER[ST.screen] ? 'f' : 'b', app = $('#app'); busy = true;
  app.dataset.t = 'out-' + dir; 
  setTimeout(() => { ST.screen = s; render(dir); busy = false; }, reduce ? 0 : 160);
}
const kick = (el, c) => { el.classList.remove(c); void el.offsetWidth; el.classList.add(c); };
function sheet(html, mid) { const s = document.createElement('div'); s.className = 'scrim'; s.innerHTML = `<div class="sheet ${mid ? 'mid' : ''}" role="dialog" aria-modal="true">${mid ? '' : '<div class="gr"></div>'}${html}</div>`; const close = () => { s.classList.add('out'); setTimeout(() => s.remove(), 200); }; s.addEventListener('click', (e) => { if (e.target === s) close(); }); s.close = close; document.body.appendChild(s); return s; }
function saveSheet() {
  const r = ST.res, ds = r.days.map((d) => d.ds).sort(), ex = ST.saved.find((s) => s.id === ST.editId), def = ex ? ex.name : `Attendance Plan – ${fmt(HOST.today())}`;
  const s = sheet(`<h3 style="font-size:18px">Save Scenario</h3><label class="mu sm" for="sn">Scenario name</label><input class="inp" id="sn" maxlength="40" value="${esc(def)}">
  <div class="row f"><div>Dates<small>${ds.map(fmt).join(', ')}</small></div></div><div class="row"><div>Classes missed</div><b>${r.missed}</b></div><div class="row"><div>Attendance</div><b>${r1(r.cur)}% → ${r1(r.pred)}% <small style="display:inline">(target ${HOST.target()}%)</small></b></div>
  <p class="mu sm" style="margin:12px 0;display:flex;gap:8px">${I('info')}Saving this plan does not mark any class absent.</p><div class="two"><button class="btn ghost" data-x="c">Cancel</button><button class="btn" data-x="s">Save Scenario</button></div>`);
  s.addEventListener('click', (e) => {
    const x = e.target.closest('[data-x]')?.dataset.x; if (!x) return; if (x === 'c') return s.close();
    const name = ($('#sn', s).value || '').trim() || def, rec = { id: ST.editId || 's' + Date.now(), name, created: HOST.today(), dates: ds, mode: ST.mode, picks: planOf(), kind: { ...ST.kind }, missed: r.missed, pred: r.pred };
    const i = ST.saved.findIndex((q) => q.id === rec.id); i >= 0 ? (ST.saved[i] = rec) : ST.saved.unshift(rec);
    HOST.save(ST.saved); ST.editId = rec.id; s.close(); toast('Scenario saved');
  });
}
function openScenario(sc) {   // re-validate against the current timetable and holidays
  const keep = sc.dates.filter((d) => Calc.selectable(d)), dropped = sc.dates.length - keep.length;
  resetPlan(); ST.dates = keep; ST.mode = sc.mode; ST.editId = sc.id; ST.kind = { ...(sc.kind || {}) }; ST.month = (keep[0] || HOST.today()).slice(0, 7); sc.picks.forEach((p) => (ST.picks[p.ds] = p.missed)); ST.active = keep[0] || null;
  if (!keep.length) { ST.note = 'None of this scenario’s dates can be planned any more (past dates, holidays or a timetable change). Pick new dates.'; return go('plan'); }
  ST.note = ''; ST.res = Calc.simulate(planOf()); go('results'); if (dropped) setTimeout(() => toast(`${dropped} date${dropped > 1 ? 's' : ''} removed (no longer valid)`), 600);
}

/* ======================= WIF-ACTIONS (patch the DOM so every change animates) ======================= */
function paintRows() { const ds = curDate(); HOST.classesOn(ds).forEach((c) => { const el = $(`.cls[data-id="${c.id}"]`); if (!el) return; const s = rowSt(ds, c); el.classList.toggle('on', s.on); el.setAttribute('aria-checked', s.on); }); $('#sum').innerHTML = sumHtml(); $('#cb').disabled = !planOf().some((p) => p.missed.length); }
function setMode(m) {
  ST.mode = m; if (m === 'sel') ST.dates.forEach((d) => { if (!ST.picks[d]) ST.picks[d] = Calc.eligible(d).map((c) => c.id); });
  $$('.pt').forEach((b) => { const on = b.dataset.v === m; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  const sg = $('#seg2'); if (sg) { sg.classList.toggle('r', m === 'sel'); $$('button', sg).forEach((b) => b.classList.toggle('on', b.dataset.v === m)); paintRows(); }
}
const A = {
  exit: () => HOST.close(), intro: () => go('intro'), plan: () => { ST.note = ''; go('plan'); }, saved: () => go('saved'), classes: () => go('classes'), results: () => go('results'), detail: () => go('detail'),
  theme: () => { HOST.setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); $('[data-a=theme]').innerHTML = I(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon'); },
  new: () => { resetPlan(); go('plan'); },
  mo: (v) => { const [y, m] = ST.month.split('-').map(Number); ST.month = iso(new Date(y, m - 1 + +v, 1)).slice(0, 7); $('#mt').textContent = calTitle(); const g = $('#cgrid'); g.innerHTML = calCells(); g.classList.remove('slf', 'slb'); void g.offsetWidth; g.classList.add(+v > 0 ? 'slf' : 'slb'); HOST.haptic(); },
  pick: (v) => {
    const i = ST.dates.indexOf(v), b = $(`.d[data-v="${v}"]`);
    if (i >= 0) { ST.dates.splice(i, 1); b.classList.replace('s', 'ok'); } else { ST.dates.push(v); ST.picks[v] = Calc.eligible(v).map((c) => c.id); b.classList.replace('ok', 's'); kick(b, 'pop'); }
    b.setAttribute('aria-pressed', i < 0); $('#pc').textContent = ST.dates.length ? `${ST.dates.length} date${ST.dates.length > 1 ? 's' : ''} selected` : 'Pick at least one date'; $('#pn').disabled = !ST.dates.length; HOST.haptic();
  },
  mode: (v) => setMode(v), mode2: (v) => setMode(v),
  toClasses: () => { ST.active = sorted()[0]; go('classes'); },
  active: (v) => { ST.active = v; $$('.dc').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); const l = $("#clist"); l.innerHTML = listHtml(); kick(l, 'sw'); },
  cls: (v) => { if (ST.mode === 'whole') setMode('sel'); const ds = curDate(), s = new Set(ST.picks[ds] || []); s.has(v) ? s.delete(v) : s.add(v); ST.picks[ds] = [...s]; paintRows(); HOST.haptic(); },
  calc: () => { ST.res = Calc.simulate(planOf()); go('results'); },
  kind: (v) => { ST.kind[v] = kindOf(v) === 'Leave' ? 'Bunk' : 'Leave'; const b = $(`[data-a=kind][data-v="${v}"]`), k = ST.kind[v]; b.textContent = k; b.className = 'tag ' + (k === 'Leave' ? 'lv' : 'bk'); kick(b, 'pop'); },
  saveSheet: () => saveSheet(),
  open: (v) => openScenario(ST.saved.find((s) => s.id === v)),
  dup: (v) => { const s = ST.saved.find((q) => q.id === v); if (!s) return; ST.saved.unshift({ ...s, id: 's' + Date.now(), name: s.name + ' (copy)', created: HOST.today() }); HOST.save(ST.saved); render('f'); toast('Scenario duplicated'); },
  del: (v) => { const s = ST.saved.find((q) => q.id === v), d = sheet(`<h3 style="font-size:18px">Delete scenario?</h3><p class="mu" style="margin:8px 0 16px">“${esc(s.name)}” will be removed. Your attendance records are not affected.</p><div class="two"><button class="btn ghost" data-x="c">Cancel</button><button class="btn red" data-x="d">Delete</button></div>`, true);
    d.addEventListener('click', (e) => { const x = e.target.closest('[data-x]')?.dataset.x; if (!x) return; if (x === 'd') { ST.saved = ST.saved.filter((q) => q.id !== v); HOST.save(ST.saved); render('f'); } d.close(); }); }
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]'); if (!b || !A[b.dataset.a]) return;
  if (b.classList.contains('btn') && !reduce) { const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2, p = document.createElement('i'); p.className = 'rip'; p.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`; b.appendChild(p); setTimeout(() => p.remove(), 600); }
  A[b.dataset.a](b.dataset.v);
});
HOST.setTheme(HOST.theme()); render('f');

</script>
</body>
</html>
