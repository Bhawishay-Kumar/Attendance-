<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Attendance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* ===================== THEME TOKENS ===================== */
html[data-theme="dark"] {
  --surface: linear-gradient(160deg, rgba(22,44,120,.58), rgba(9,22,70,.7));
  --border: rgba(62,112,235,.55); --shadow: 0 22px 40px -26px #000, inset 0 1px 0 rgba(130,170,255,.22), 0 0 22px -10px rgba(50,100,255,.5);
  --text: #f2f5ff; --muted: #9db0df; --code: #27d3f0; --chip: rgba(36,64,150,.5); --chip-b: rgba(90,135,235,.5); --chip-fg: #b9c9f2;
  --present: linear-gradient(120deg,#13dba2,#08b49c); --present-sh: 0 10px 22px -12px rgba(20,230,170,.85);
  --absent-bg: linear-gradient(120deg,#ff2f75,#e51c4a); --absent-fg: #fff; --absent-b: transparent; --absent-sh: 0 10px 22px -12px rgba(255,50,110,.85);
  --ghost-bg: rgba(20,40,110,.7); --ghost-b: rgba(95,140,240,.5); --ghost-fg: #a9bdf0;
  --ok-bg: linear-gradient(120deg,#12c99b,#0a9f8d); --ok-fg: #fff; --ok-pill-bg: rgba(10,90,90,.5); --ok-pill-b: rgba(45,230,180,.7); --ok-pill-fg: #3df0b8;
  --no-bg: linear-gradient(120deg,#d62957,#a8173f); --no-fg: #fff; --no-pill-bg: rgba(110,20,60,.5); --no-pill-b: rgba(255,90,140,.7); --no-pill-fg: #ff86a8;
  --nc-bg: linear-gradient(120deg,#4a4fa8,#363a86); --nc-fg: #fff; --nc-pill-bg: rgba(60,50,150,.5); --nc-pill-b: rgba(150,130,255,.7); --nc-pill-fg: #c3b8ff;
  --nm-fg: #b9c9f2; --nm-bg: rgba(25,45,120,.5); --nm-b: rgba(100,140,240,.5);
  --glass: linear-gradient(135deg, rgba(44,66,138,.5), rgba(13,25,68,.72)); --dedge: linear-gradient(120deg, rgba(40,130,255,.95), rgba(70,200,255,.55) 35%, rgba(110,80,255,.75) 65%, rgba(190,90,255,.95));
  --dshadow: 0 30px 56px -20px rgba(8,30,200,.85), 0 0 40px -10px rgba(60,110,255,.5), inset 0 1px 0 rgba(140,175,255,.25); --dink: #91a9d0; --dcut: #14224f;
  --capglow: 0 14px 32px -8px rgba(40,90,255,.9), 0 0 28px rgba(120,70,255,.55); --track-ink: #6c84b8;
}
html[data-theme="light"] {
  --surface: linear-gradient(160deg, rgba(255,255,255,.86), rgba(238,245,255,.72));
  --border: rgba(160,190,245,.6); --shadow: 0 20px 36px -26px rgba(60,100,200,.5), inset 0 1px 0 #fff;
  --text: #0e1a52; --muted: #6578a8; --code: #1d63e8; --chip: rgba(232,240,255,.9); --chip-b: rgba(170,195,240,.6); --chip-fg: #4d62a0;
  --present: linear-gradient(120deg,#17cf9d,#09a98f); --present-sh: 0 10px 20px -12px rgba(10,170,140,.8);
  --absent-bg: rgba(255,236,242,.95); --absent-fg: #e8234f; --absent-b: rgba(240,90,130,.5); --absent-sh: none;
  --ghost-bg: rgba(238,244,255,.95); --ghost-b: rgba(170,195,240,.6); --ghost-fg: #4b5fa3;
  --ok-bg: linear-gradient(120deg,#c9f3df,#b5ecd3); --ok-fg: #0a7a55; --ok-pill-bg: rgba(210,247,230,.9); --ok-pill-b: rgba(40,190,140,.55); --ok-pill-fg: #0a7a55;
  --no-bg: linear-gradient(120deg,#ffd9e2,#ffc9d6); --no-fg: #c2173e; --no-pill-bg: rgba(255,225,233,.9); --no-pill-b: rgba(240,90,130,.5); --no-pill-fg: #c2173e;
  --nc-bg: linear-gradient(120deg,#e4e0ff,#d6d0fb); --nc-fg: #4c3cc4; --nc-pill-bg: rgba(232,228,255,.95); --nc-pill-b: rgba(140,120,240,.5); --nc-pill-fg: #4c3cc4;
  --nm-fg: #5d70a8; --nm-bg: rgba(238,244,255,.95); --nm-b: rgba(170,195,240,.6);
  --glass: linear-gradient(135deg, rgba(255,255,255,.78), rgba(232,241,255,.56)); --dedge: linear-gradient(120deg,#fff,rgba(130,210,255,.85) 40%,#fff 60%,rgba(215,140,255,.9));
  --dshadow: 0 28px 50px -20px rgba(80,100,255,.5), 0 2px 10px rgba(120,140,255,.18), inset 0 1px 0 #fff; --dink: #5b70a6; --dcut: #e9f1ff;
  --capglow: 0 14px 30px -8px rgba(110,90,255,.75), 0 0 24px rgba(150,110,255,.4); --track-ink: #8d9fc8;
}

/* ===================== BASE ===================== */
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html { --p: 0; background: #0b1230; }
body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--text); min-height: 100vh; overflow-x: hidden; transition: color .4s; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
svg { display: block; }
.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 14px calc(130px + env(safe-area-inset-bottom, 0px)); }
.surf, .btn, .pill, .chip, .ico, .strip, .hbtn { transition: background .4s ease, border-color .4s ease, color .4s ease, box-shadow .4s ease; }
.surf { background: var(--surface); border: 1.5px solid var(--border); box-shadow: var(--shadow); border-radius: 24px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }

/* ===================== SCENE (follows --p: 0 day … 1 night) ===================== */
.sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.sky * { pointer-events: none; }
.day, .night { position: absolute; inset: 0; }
.day { opacity: calc(1 - var(--p)); background: radial-gradient(70% 45% at 85% 4%, rgba(255,236,200,.85), transparent 70%), linear-gradient(180deg,#b3d9ff 0%,#d9ebff 50%,#f7f1ff 100%); }
.night { opacity: var(--p); background: radial-gradient(60% 40% at 15% 6%, rgba(120,140,255,.28), transparent 70%), linear-gradient(180deg,#040b22 0%,#0b1a4e 55%,#241a70 100%); }
.sun { position: absolute; right: 6%; top: 3%; width: 190px; height: 190px; border-radius: 50%; will-change: transform; background: radial-gradient(closest-side, rgba(255,246,214,1), rgba(255,220,150,.55) 42%, transparent); transform: translateY(calc(var(--p) * 170px)) scale(calc(1 - var(--p) * .35)); }
.moon { position: absolute; left: 6%; top: 3%; width: 170px; height: 170px; border-radius: 50%; will-change: transform; background: radial-gradient(closest-side, rgba(225,235,255,.85) 0 22%, rgba(160,180,255,.28) 45%, transparent); transform: translateY(calc((1 - var(--p)) * 170px)) scale(calc(.7 + var(--p) * .3)); }
.cl { position: absolute; width: 210px; height: 60px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); will-change: transform; animation: drift 22s ease-in-out infinite alternate; }
.c1 { left: 4%; top: 22%; } .c2 { right: 2%; top: 40%; width: 260px; animation-duration: 28s; animation-direction: alternate-reverse; opacity: .8; } .c3 { left: 40%; top: 10%; width: 150px; height: 44px; animation-duration: 19s; opacity: .75; }
@keyframes drift { to { transform: translateX(46px); } }
.stars { position: absolute; inset: 0; }
.st1 { background-image: radial-gradient(1.6px 1.6px at 7% 18%,#fff,transparent), radial-gradient(1.2px 1.2px at 22% 38%,#cfe0ff,transparent), radial-gradient(1.6px 1.6px at 41% 14%,#fff,transparent), radial-gradient(1.2px 1.2px at 58% 30%,#fff,transparent), radial-gradient(1.6px 1.6px at 76% 12%,#cfe0ff,transparent), radial-gradient(1.2px 1.2px at 91% 34%,#fff,transparent), radial-gradient(1.2px 1.2px at 15% 62%,#fff,transparent), radial-gradient(1.2px 1.2px at 70% 70%,#fff,transparent); animation: twinkle 3.2s ease-in-out infinite alternate; }
.st2 { background-image: radial-gradient(1.2px 1.2px at 12% 8%,#fff,transparent), radial-gradient(1.6px 1.6px at 33% 24%,#fff,transparent), radial-gradient(1.2px 1.2px at 50% 8%,#cfe0ff,transparent), radial-gradient(1.6px 1.6px at 68% 22%,#fff,transparent), radial-gradient(1.2px 1.2px at 84% 20%,#fff,transparent), radial-gradient(1.2px 1.2px at 96% 52%,#cfe0ff,transparent), radial-gradient(1.6px 1.6px at 6% 46%,#fff,transparent), radial-gradient(1.2px 1.2px at 40% 80%,#cfe0ff,transparent); animation: twinkle 4.4s 1.2s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
.au { position: absolute; left: -25%; width: 150%; height: 150px; border-radius: 50%; will-change: transform; animation: aur 16s ease-in-out infinite alternate; }
.a1 { top: 28%; background: radial-gradient(closest-side, rgba(70,235,205,.26), rgba(80,130,255,.1) 60%, transparent); transform: rotate(-7deg); }
.a2 { top: 58%; background: radial-gradient(closest-side, rgba(160,90,255,.28), rgba(60,110,255,.1) 60%, transparent); animation-duration: 21s; animation-direction: alternate-reverse; }
@keyframes aur { from { translate: -4% 0; } to { translate: 5% -12px; } }
.shoot { position: absolute; top: 12%; left: 72%; width: 90px; height: 2px; border-radius: 2px; background: linear-gradient(90deg,#fff,transparent); opacity: 0; animation: shoot 12s 3s linear infinite; }
@keyframes shoot { 0% { opacity: 0; transform: rotate(28deg) translateX(0); } 2% { opacity: 1; } 6%, 100% { opacity: 0; transform: rotate(28deg) translateX(-260px); } }
.hills { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 26%; }
.hills.d { opacity: calc(1 - var(--p)); } .hills.n { opacity: var(--p); }

/* ===================== HEADER + DAY/NIGHT TOGGLE ===================== */
.hdr { display: flex; align-items: center; gap: 8px; padding: 4px 2px 14px; animation: rise .65s cubic-bezier(.2,.9,.3,1) both; }
.logo { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 23px; color: #fff; flex: none; background: radial-gradient(circle at 35% 30%, #4c8dff, #1c47c9); box-shadow: 0 0 0 3px rgba(120,170,255,.45), 0 0 24px rgba(70,120,255,.6); animation: logoIn .8s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes logoIn { from { transform: scale(.5) rotate(-40deg); opacity: 0; } }
.ttl { flex: 1; min-width: 0; } .ttl h1 { font-size: 21px; font-weight: 800; letter-spacing: -.015em; line-height: 1.1; } .ttl p { margin-top: 3px; font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtn { position: relative; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; font-size: 21px; flex: none; background: var(--chip); border: 1.5px solid var(--chip-b); transition: transform .2s cubic-bezier(.3,1.5,.5,1), background .4s, border-color .4s; }
.hbtn:active { transform: scale(.9); }
.badge { position: absolute; top: -6px; right: -6px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: #ff4d6a; color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 4px 10px -2px rgba(255,60,100,.7); }

.tg { --h: 38px; --pad: 4px; --d: calc(var(--h) - var(--pad) * 2); position: relative; display: block; flex: none; width: calc(var(--h) * 2); height: var(--h); padding: 0; border-radius: 999px; cursor: pointer; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.tg:active { transform: scale(.97); } .tg:focus-visible { outline: 2px solid #7aa2ff; outline-offset: 3px; } .tg.dragging { cursor: grabbing; }
.tbg { position: absolute; inset: 0; border-radius: inherit; }
.tbg::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: var(--e); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.tbg::after { content: ""; position: absolute; left: 12%; right: 12%; top: 2px; height: 42%; border-radius: 999px; background: radial-gradient(70% 100% at 50% 0%, rgba(255,255,255,.3), transparent 75%); }
.tbg.d { opacity: calc(1 - var(--p)); background: linear-gradient(135deg, rgba(255,255,255,.8), rgba(224,235,255,.58)); box-shadow: 0 12px 24px -14px rgba(70,110,230,.6), inset 0 2px 5px rgba(120,150,230,.16); --e: linear-gradient(120deg,#fff,rgba(140,195,255,.95) 50%,#fff); }
.tbg.n { opacity: var(--p); background: linear-gradient(135deg, rgba(26,48,118,.65), rgba(8,18,56,.8)); box-shadow: 0 14px 26px -12px rgba(10,40,210,.85), inset 0 2px 6px rgba(0,0,0,.4); --e: linear-gradient(120deg,rgba(45,125,255,.95),rgba(90,205,255,.5) 40%,rgba(125,85,255,.85)); }
.slot { position: absolute; top: 0; bottom: 0; width: var(--h); display: grid; place-items: center; color: var(--track-ink); }
.slot svg { width: 42%; height: 42%; }
.s-sun { left: 0; opacity: var(--p); transform: scale(calc(.5 + var(--p) * .5)) rotate(calc((1 - var(--p)) * -70deg)); }
.s-moon { right: 0; opacity: calc(1 - var(--p)); transform: scale(calc(1 - var(--p) * .5)) rotate(calc(var(--p) * 70deg)); }
.fx { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
.star { position: absolute; width: 2.5px; height: 2.5px; border-radius: 50%; background: #cfe0ff; opacity: var(--p); }
.star:nth-child(1) { left: 36%; top: 26%; } .star:nth-child(2) { left: 47%; top: 64%; width: 2px; height: 2px; } .star:nth-child(3) { left: 25%; top: 72%; width: 2px; height: 2px; } .star:nth-child(4) { left: 53%; top: 30%; width: 2px; height: 2px; }
.cloud { position: absolute; left: 44%; top: 58%; width: 26%; height: 22%; border-radius: 999px; background: rgba(255,255,255,.88); box-shadow: -6px -5px 0 -2px rgba(255,255,255,.8), 8px -3px 0 -3px rgba(255,255,255,.75); opacity: calc(1 - var(--p)); transform: translateX(calc(var(--p) * 12px)); }
.thumb { position: absolute; left: var(--pad); top: var(--pad); width: var(--d); height: var(--d); will-change: transform; pointer-events: none; }
.body { position: absolute; inset: 0; transition: scale .5s cubic-bezier(.25,1.8,.5,1); } .thumb.press .body { scale: 1.14; }
.sh { position: absolute; inset: 0; border-radius: 50%; }
.sh.d { opacity: calc(1 - var(--p)); box-shadow: 0 8px 16px -6px rgba(60,100,220,.55); }
.sh.n { opacity: var(--p); box-shadow: 0 0 22px rgba(50,120,255,.75), 0 8px 16px -6px rgba(20,60,220,.85); }
.lens { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; display: grid; place-items: center; -webkit-backdrop-filter: blur(4px) saturate(1.8); backdrop-filter: blur(4px) saturate(1.8); }
.tint { position: absolute; inset: 0; border-radius: 50%; }
.tint.d { opacity: calc(1 - var(--p)); background: linear-gradient(145deg,#fff,#e8f0ff); box-shadow: inset 0 0 0 1px rgba(255,255,255,.9), inset 0 -3px 6px rgba(110,140,230,.22); }
.tint.n { opacity: var(--p); background: linear-gradient(145deg,#5a9bff,#2563eb); box-shadow: inset 0 0 0 1.5px rgba(135,205,255,.65), inset 0 3px 7px rgba(255,255,255,.35), inset 0 -4px 7px rgba(10,30,150,.35); }
.lens::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0) 50%); }
.lens::after { content: ""; position: absolute; z-index: 2; top: 0; bottom: 0; width: 45%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.6), transparent); transform: skewX(-18deg); }
.thumb.go .lens::after { animation: shine .7s ease-out; } @keyframes shine { to { left: 130%; } }
.ic { position: absolute; z-index: 3; width: 50%; height: 50%; will-change: transform, opacity; }
.ic-sun { color: #1f6bff; opacity: calc(1 - var(--p) * 2); transform: rotate(calc(var(--p) * 160deg)) scale(calc(1 - var(--p) * .7)); }
.ic-moon { color: #fff; opacity: calc(var(--p) * 2 - 1); transform: rotate(calc((1 - var(--p)) * -160deg)) scale(calc(.3 + var(--p) * .7)); filter: drop-shadow(0 0 5px rgba(255,255,255,.55)); }

/* ===================== PAGES ===================== */
.page { display: none; } .page.on { display: block; }
.pg-title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin: 4px 2px 12px; }
@keyframes rise { from { opacity: 0; transform: translate(var(--dx, 0px), 18px) scale(.98); } }
.date, .bulk { animation: rise .65s cubic-bezier(.2,.9,.3,1) both; } .date { animation-delay: .07s; } .bulk { animation-delay: .14s; }

/* date card */
.date { padding: 14px; display: grid; gap: 12px; margin-bottom: 12px; }
.drow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.arrow { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; color: #6f9bff; transition: transform .2s, background .3s; } .arrow:active { transform: scale(.86); } .arrow:hover { background: var(--chip); }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 12px; background: var(--chip); border: 1.5px solid var(--chip-b); color: var(--chip-fg); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .2s, background .4s, border-color .4s, color .4s; } .chip:active { transform: scale(.95); } .chip .i { font-size: 17px; color: #5b8cff; }
.chip.big { flex: 1 1 auto; min-width: 0; justify-content: center; height: 42px; font-size: clamp(13px, 3.8vw, 16px); color: var(--text); padding: 0 14px; } .chip.big .i { flex: none; }
.date-txt { overflow: hidden; text-overflow: ellipsis; display: inline-block; }
.row2 { display: flex; justify-content: space-between; }

/* bulk */
.bulk { padding: 14px; margin-bottom: 12px; }
.bulk h2 { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; margin-bottom: 12px; } .bulk h2 .i { font-size: 22px; color: #8b6dff; }
.count { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--chip); border: 1px solid var(--chip-b); border-radius: 999px; padding: 3px 11px; } .count.bump { animation: bump .4s cubic-bezier(.3,1.6,.5,1); } @keyframes bump { 40% { transform: scale(1.25); } }
.prog { height: 5px; border-radius: 9px; background: var(--chip); margin: -2px 0 12px; overflow: hidden; } .prog i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg,#3b6bff,#8b5cf6,#14d4a0); transition: width .7s cubic-bezier(.3,.9,.3,1); }
.brow { display: grid; grid-template-columns: 1fr 1fr 48px; gap: 8px; }
.brow .btn:not(.b-ghost) { font-size: 14px; gap: 7px; padding: 0 6px; }

/* buttons */
.btn { white-space: nowrap; height: 46px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; font-weight: 700; font-size: 15px; position: relative; overflow: hidden; transition: transform .2s cubic-bezier(.3,1.5,.5,1), box-shadow .3s, filter .2s, background .4s, border-color .4s, color .4s; }
.btn .i { font-size: 19px; stroke-width: 2.6; } .btn:hover { filter: brightness(1.06); transform: translateY(-1px); } .btn:active { transform: scale(.95); }
.btn:focus-visible, .hbtn:focus-visible, .chip:focus-visible, .arrow:focus-visible, .item:focus-visible { outline: 2px solid #7aa2ff; outline-offset: 2px; }
.b-present { color: #fff; background: var(--present); box-shadow: var(--present-sh), inset 0 1px 0 rgba(255,255,255,.35); }
.b-present::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.4), transparent); transform: skewX(-18deg); transition: left .7s ease; } .b-present:hover::after { left: 130%; }
.b-absent { color: var(--absent-fg); background: var(--absent-bg); border: 1.5px solid var(--absent-b); box-shadow: var(--absent-sh); }
.b-ghost { width: 48px; color: var(--ghost-fg); background: var(--ghost-bg); border: 1.5px solid var(--ghost-b); } .b-ghost .i { stroke-width: 2; font-size: 22px; transition: transform .3s; } .b-ghost:hover .i { transform: rotate(-15deg); }
.rip { position: absolute; border-radius: 50%; background: currentColor; opacity: .28; transform: scale(0); animation: rip .6s ease-out forwards; pointer-events: none; } @keyframes rip { to { transform: scale(1); opacity: 0; } }

/* subject cards */
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.sc { position: relative; min-width: 0; container-type: inline-size; padding: 12px 14px 14px; display: grid; gap: 10px; animation: rise .5s cubic-bezier(.2,.9,.3,1) both; animation-delay: calc(.2s + var(--n) * 60ms); transition: border-color .45s ease, box-shadow .45s ease, background .4s; }
.sc > * { position: relative; }
.sc::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(150px 95px at 36px 80px, color-mix(in srgb, var(--ac) 20%, transparent), transparent 70%); }
.sc[data-state="present"] { --fc: rgba(30,220,160,.6); border-color: rgba(40,205,155,.6); } .sc[data-state="absent"] { --fc: rgba(255,80,130,.6); border-color: rgba(255,95,140,.6); } .sc[data-state="noclass"] { --fc: rgba(140,120,255,.6); border-color: rgba(145,125,255,.6); }
.sc.flash::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; animation: flash .8s ease-out forwards; } @keyframes flash { from { box-shadow: 0 0 0 0 var(--fc), inset 0 0 34px var(--fc); } to { box-shadow: 0 0 0 16px transparent, inset 0 0 0 transparent; } }
.sc.flash .ico { animation: icoPop .65s cubic-bezier(.3,1.6,.5,1); } @keyframes icoPop { 35% { transform: scale(1.2) rotate(-7deg); } }

/* ===================== LIQUID-GLASS DOCK ===================== */

.dlens::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0) 48%); }
.dlens::after { content: ""; position: absolute; z-index: 2; top: 0; bottom: 0; width: 45%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-18deg); }

.pop[data-k=home] svg { animation: hop .5s cubic-bezier(.3,1.4,.5,1); } .pop[data-k=att] .tick { animation: dtick .5s .1s ease both; } .pop[data-k=time] .hand { animation: spin .7s cubic-bezier(.3,.9,.3,1); }

/* ===================== REDESIGN ADDITIONS ===================== */

/* segmented glass slider */

/* HOME */

  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'attendance_report.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); buzz('success');
}
